openapi: 3.1.0
info:
  title: Proofly Geofenced Attendance API
  version: 1.0.0-p0
  description: >
    Multi-tenant geofenced staff attendance SaaS API. Contract-first OpenAPI 3.1 specification.
  contact:
    name: Proofly Engineering
    email: engineering@proofly.com
servers:
  - url: http://localhost:8080
    description: Local Spring Boot API
paths:
  /api/v1/auth/signup-org:
    post:
      tags:
        - Authentication & Devices
      summary: Create organization, provision tenant database, and sign in owner
      operationId: signupOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupOrgRequest'
      responses:
        '201':
          description: Organization provisioned and owner authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Slug, email, or phone already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication & Devices
      summary: Sign in with email/password or phone/PIN
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '423':
          description: PIN locked due to repeated failures
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication & Devices
      summary: Rotate refresh token (cookie for web or bearer body for mobile)
      operationId: refreshToken
      parameters:
        - name: X-Client-Type
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/ClientType'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token expired, revoked, or reused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication & Devices
      summary: Revoke refresh token family and denylist active access token
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Signed out
  /api/v1/devices:
    get:
      tags:
        - Authentication & Devices
      summary: List registered devices for the authenticated user
      operationId: listDevices
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceView'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/devices/{deviceId}:
    delete:
      tags:
        - Authentication & Devices
      summary: Revoke a registered device and invalidate all its refresh token families
      operationId: revokeDevice
      security:
        - bearerJwt: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked
        '404':
          description: Device not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/mfa/setup:
    post:
      tags:
        - Authentication & Devices
      summary: Initiate TOTP MFA enrollment for ADMIN or SUPER_ADMIN
      operationId: setupMfa
      security:
        - bearerJwt: []
      responses:
        '200':
          description: TOTP secret and otpauth URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/mfa/enable:
    post:
      tags:
        - Authentication & Devices
      summary: Verify TOTP code and enable MFA
      operationId: enableMfa
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnableRequest'
      responses:
        '204':
          description: MFA enabled
        '401':
          description: Invalid TOTP code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Authentication & Devices
      summary: Request a password reset email (non-enumerating 202 Accepted)
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset link enqueued if matching active account exists
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - Authentication & Devices
      summary: Confirm password reset with single-use token and revoke active sessions
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset and sessions revoked
        '400':
          description: Invalid or expired token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/verify-email/confirm:
    post:
      tags:
        - Authentication & Devices
      summary: Verify user email address using single-use verification token
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
      responses:
        '204':
          description: Email verified
        '400':
          description: Invalid or expired token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/verify-email/resend:
    post:
      tags:
        - Authentication & Devices
      summary: Re-send email verification link for current authenticated user
      operationId: resendEmailVerification
      security:
        - bearerJwt: []
      responses:
        '202':
          description: Verification email enqueued if not already verified
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenants/me:
    get:
      tags:
        - Tenants
      summary: Get current authenticated tenant profile
      operationId: currentTenant
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Current tenant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
        '401':
          description: Unauthorized or missing tenant context
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/billing/plans:
    get:
      tags:
        - Billing & Payment Gateways
      summary: List the 4 active subscription plans with multi-currency gateway pricing
      operationId: listPlans
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanView'
  /api/v1/billing/subscription:
    get:
      tags:
        - Billing & Payment Gateways
      summary: Get current tenant subscription and ledger credit balance
      operationId: currentSubscription
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Current subscription state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionView'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/billing/checkout:
    post:
      tags:
        - Billing & Payment Gateways
      summary: Initialize gateway-routed multi-currency subscription checkout (idempotent)
      operationId: checkoutSubscription
      security:
        - bearerJwt: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Gateway authorization URL, gateway code, and reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Missing Idempotency-Key or invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/billing/verify:
    get:
      tags:
        - Billing & Payment Gateways
      summary: Verify payment settlement status against routed gateway for callback page
      operationId: verifyPayment
      security:
        - bearerJwt: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPaymentResponse'
        '404':
          description: Payment reference not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/billing/payments:
    get:
      tags:
        - Billing & Payment Gateways
      summary: List tenant payment receipts in original settled currency without FX conversion
      operationId: listTenantPayments
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Payment receipts in settled currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentReceiptView'
  /api/v1/webhooks/paystack:
    post:
      tags:
        - Billing & Payment Gateways
      summary: Receive and process HMAC-SHA512 verified Paystack webhook events
      operationId: paystackWebhook
      parameters:
        - name: x-paystack-signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event accepted or already processed idempotently
        '401':
          description: Invalid HMAC signature
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/webhooks/stripe:
    post:
      tags:
        - Billing & Payment Gateways
      summary: Receive and process HMAC-SHA256 verified Stripe webhook events
      operationId: stripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Event accepted or already processed idempotently
        '401':
          description: Invalid or expired Stripe signature
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/notifications/outbox:
    get:
      tags:
        - Notifications
      summary: List recent notification outbox deliveries for current tenant
      operationId: listNotificationOutbox
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Outbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboxView'
  /api/v1/notifications/outbox/{notificationId}/retry:
    post:
      tags:
        - Notifications
      summary: Re-queue a failed or dead-letter notification for current tenant
      operationId: retryNotification
      security:
        - bearerJwt: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Re-queued for immediate delivery
        '404':
          description: Retryable notification not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/org/settings:
    get:
      tags:
        - Organization & Staff
      summary: Get organization attendance and geofence defaults
      operationId: getOrgSettings
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsView'
    put:
      tags:
        - Organization & Staff
      summary: Update organization defaults (ADMIN+)
      operationId: updateOrgSettings
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgSettingsRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsView'
  /api/v1/org/members:
    get:
      tags:
        - Organization & Staff
      summary: List visible staff members scoped by caller role
      operationId: listMembers
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Visible staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberSummary'
  /api/v1/org/invites:
    get:
      tags:
        - Organization & Staff
      summary: List staff invitations (ADMIN+)
      operationId: listInvitations
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationView'
    post:
      tags:
        - Organization & Staff
      summary: Invite staff by work email or onboard with E.164 Phone + PIN (ADMIN+)
      operationId: inviteStaff
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
      responses:
        '201':
          description: Staff invited or activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
  /api/v1/org/invites/accept:
    post:
      tags:
        - Organization & Staff
      summary: Accept an email staff invitation and set initial password
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '204':
          description: Invitation accepted
  /api/v1/org/members/{membershipId}:
    patch:
      tags:
        - Organization & Staff
      summary: Update member role, manager, or status (ADMIN+ / SUPER_ADMIN)
      operationId: updateMember
      security:
        - bearerJwt: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
  /api/v1/sites:
    get:
      tags:
        - Sites & Geofences
      summary: List visible sites
      operationId: listSites
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Visible sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteView'
    post:
      tags:
        - Sites & Geofences
      summary: Create a new geofenced work site (ADMIN+)
      operationId: createSite
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteView'
  /api/v1/sites/{siteId}:
    patch:
      tags:
        - Sites & Geofences
      summary: Update site geofence radius, coordinates, shift rules, or active state (ADMIN+)
      operationId: updateSite
      security:
        - bearerJwt: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteView'
  /api/v1/sites/assignments/me:
    get:
      tags:
        - Sites & Geofences
      summary: Get current user's assigned sites with effective per-site shift rules
      operationId: mySiteAssignments
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Assigned sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteAssignmentView'
  /api/v1/sites/assignments/{membershipId}:
    put:
      tags:
        - Sites & Geofences
      summary: Set assigned sites and shift overrides for a staff member (ADMIN+)
      operationId: setMemberAssignments
      security:
        - bearerJwt: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAssignmentsRequest'
      responses:
        '200':
          description: Updated assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteAssignmentView'
  /api/v1/attendance/clock-in:
    post:
      tags:
        - Attendance & Corrections
      summary: Record a geofenced clock-in event
      operationId: clockIn
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clock-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceEventView'
  /api/v1/attendance/clock-out:
    post:
      tags:
        - Attendance & Corrections
      summary: Record a geofenced clock-out event paired with open shift
      operationId: clockOut
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
      responses:
        '201':
          description: Clock-out recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceEventView'
  /api/v1/attendance/me:
    get:
      tags:
        - Attendance & Corrections
      summary: List personal clock-in/out history
      operationId: myAttendance
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 40
      responses:
        '200':
          description: Attendance events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceEventView'
  /api/v1/attendance/flagged:
    get:
      tags:
        - Attendance & Corrections
      summary: List PENDING_REVIEW out-of-fence clock attempts scoped by role (MANAGER+)
      operationId: listFlaggedAttendance
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Flagged events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceEventView'
  /api/v1/attendance/{eventId}/review:
    post:
      tags:
        - Attendance & Corrections
      summary: Approve or reject a flagged out-of-fence clock attempt (MANAGER+)
      operationId: reviewFlaggedAttendance
      security:
        - bearerJwt: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Reviewed event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceEventView'
  /api/v1/attendance/corrections:
    get:
      tags:
        - Attendance & Corrections
      summary: List attendance corrections scoped strictly by caller role
      operationId: listCorrections
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Corrections list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionView'
    post:
      tags:
        - Attendance & Corrections
      summary: Submit an attendance timestamp correction request with reason
      operationId: requestCorrection
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrectionRequest'
      responses:
        '201':
          description: Correction requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionView'
  /api/v1/attendance/corrections/{correctionId}/review:
    post:
      tags:
        - Attendance & Corrections
      summary: Approve or reject an attendance correction (MANAGER+)
      operationId: reviewCorrection
      security:
        - bearerJwt: []
      parameters:
        - name: correctionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Decided correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionView'
  /api/v1/leave/requests:
    get:
      tags:
        - Leave Management
      summary: List leave requests visible to current user
      operationId: listLeaveRequests
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequestView'
    post:
      tags:
        - Leave Management
      summary: Submit a leave request routed to assigned manager
      operationId: submitLeaveRequest
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
      responses:
        '201':
          description: Leave created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestView'
  /api/v1/leave/requests/{leaveId}/review:
    post:
      tags:
        - Leave Management
      summary: Approve or reject a team member's leave request (MANAGER+)
      operationId: reviewLeaveRequest
      security:
        - bearerJwt: []
      parameters:
        - name: leaveId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveDecisionRequest'
      responses:
        '200':
          description: Decided leave request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestView'
  /api/v1/leave/requests/{leaveId}/cancel:
    post:
      tags:
        - Leave Management
      summary: Cancel one's own PENDING leave request
      operationId: cancelLeaveRequest
      security:
        - bearerJwt: []
      parameters:
        - name: leaveId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canceled leave request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestView'
  /api/v1/reports/live-board:
    get:
      tags:
        - Live Board & Payroll Reports
      summary: Real-time presence board (MANAGER+)
      operationId: getLiveBoard
      security:
        - bearerJwt: []
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Live board snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveBoardResponse'
  /api/v1/reports/payroll-summary:
    get:
      tags:
        - Live Board & Payroll Reports
      summary: Payroll regular, late, and overtime hours summary (MANAGER+)
      operationId: getPayrollSummary
      security:
        - bearerJwt: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: siteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payroll rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayrollRow'
  /api/v1/reports/payroll-csv:
    get:
      tags:
        - Live Board & Payroll Reports
      summary: Download payroll-ready CSV (MANAGER+)
      operationId: downloadPayrollCsv
      security:
        - bearerJwt: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: siteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV payroll export
          content:
            text/csv:
              schema:
                type: string
  /api/v1/audit/tenant-logs:
    get:
      tags:
        - Audit Log
      summary: List tenant SHA-256 hash-chained audit logs (ADMIN+)
      operationId: listTenantAuditLogs
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Tenant audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantAuditEntryView'
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClientType:
      type: string
      enum: [WEB, MOBILE, API]
    LoginMethod:
      type: string
      enum: [EMAIL_PASSWORD, PHONE_PIN]
    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, MANAGER, EMPLOYEE]
    GatewayCode:
      type: string
      enum: [PAYSTACK, STRIPE]
    SignupOrgRequest:
      type: object
      required: [orgName, slug, fullName, email, password]
      properties:
        orgName:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,50}$'
        defaultTimezone:
          type: string
          default: Africa/Lagos
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
        password:
          type: string
          minLength: 10
          maxLength: 128
        deviceFingerprint:
          type: string
        deviceName:
          type: string
        clientType:
          $ref: '#/components/schemas/ClientType'
    LoginRequest:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/LoginMethod'
        email:
          type: string
          format: email
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
        password:
          type: string
        pin:
          type: string
          pattern: '^\d{4,8}$'
        totpCode:
          type: string
          pattern: '^\d{6}$'
        deviceFingerprint:
          type: string
        deviceName:
          type: string
        clientType:
          $ref: '#/components/schemas/ClientType'
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    MfaSetupResponse:
      type: object
      required: [base32Secret, otpauthUri]
      properties:
        base32Secret:
          type: string
        otpauthUri:
          type: string
    MfaEnableRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode:
          type: string
          pattern: '^\d{6}$'
    AuthUserView:
      type: object
      required: [userId, tenantId, membershipId, fullName, role, mfaEnabled]
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        phoneE164:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        mfaEnabled:
          type: boolean
    AuthResponse:
      type: object
      required: [accessToken, expiresInSeconds, tokenType, refreshExpiresAt, deviceId, user]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        tokenType:
          type: string
        refreshToken:
          type: string
          nullable: true
        refreshExpiresAt:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/AuthUserView'
    DeviceView:
      type: object
      required: [id, deviceName, platform, lastSeenAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          type: string
          enum: [WEB_PWA, IOS, ANDROID, API]
        lastSeenAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    TenantSummary:
      type: object
      required: [id, slug, name, status, schemaVersion, currentPlanId, defaultCurrency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [PENDING, PROVISIONING, ACTIVE, SUSPENDED, DELETING]
        dbHost:
          type: string
        dbPort:
          type: integer
        dbName:
          type: string
        schemaVersion:
          type: string
        currentPlanId:
          type: string
          format: uuid
        defaultCurrency:
          type: string
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      required: [type, title, status, detail, errorCode, correlationId, timestamp]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errorCode:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties:
            type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      required: [tenantId, token, newPassword]
      properties:
        tenantId:
          type: string
          format: uuid
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    EmailVerifyConfirmRequest:
      type: object
      required: [tenantId, token]
      properties:
        tenantId:
          type: string
          format: uuid
        token:
          type: string
    PlanPriceView:
      type: object
      required: [currency, gateway, monthlyPriceMinor, annualPriceMinor]
      properties:
        currency:
          type: string
        gateway:
          $ref: '#/components/schemas/GatewayCode'
        monthlyPriceMinor:
          type: integer
          format: int64
        annualPriceMinor:
          type: integer
          format: int64
    PlanView:
      type: object
      required: [id, code, name, maxMembers, maxSites, monthlyPriceMinor, annualPriceMinor, currency, gateway, isActive, prices]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        maxMembers:
          type: integer
        maxSites:
          type: integer
        monthlyPriceMinor:
          type: integer
          format: int64
        annualPriceMinor:
          type: integer
          format: int64
        currency:
          type: string
        gateway:
          $ref: '#/components/schemas/GatewayCode'
