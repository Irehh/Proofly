spring:
  application:
    name: proofly-api
  threads:
    virtual:
      enabled: true
  flyway:
    # Managed explicitly per datasource track (control vs tenant)
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${PROOFLY_REDIS_HOST:localhost}
      port: ${PROOFLY_REDIS_PORT:6379}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

proofly:
  control-plane:
    jdbc-url: ${PROOFLY_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/proofly_control}
    username: ${PROOFLY_CONTROL_DB_USERNAME:proofly_admin}
    password: ${PROOFLY_CONTROL_DB_PASSWORD:proofly_local_dev_password}
    max-pool-size: 12
    min-idle: 2
  tenancy:
    default-db-host: ${PROOFLY_TENANT_DB_HOST:localhost}
    default-db-port: ${PROOFLY_TENANT_DB_PORT:5432}
    db-username: ${PROOFLY_TENANT_DB_USERNAME:proofly_admin}
    db-password: ${PROOFLY_TENANT_DB_PASSWORD:proofly_local_dev_password}
    use-pgbouncer: ${PROOFLY_USE_PGBOUNCER:false}
    max-cached-pools: 25
    per-tenant-max-pool-size: 3
    per-tenant-min-idle: 0
    global-connection-cap: 90
    migration-concurrency: 4
    migration-failure-threshold: 3
    expected-tenant-schema-version: "1"
  security:
    jwt:
      issuer: ${PROOFLY_JWT_ISSUER:https://api.proofly.com}
      key-id: ${PROOFLY_JWT_KEY_ID:proofly-k1}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      cookie-name: proofly_refresh
      cookie-secure: ${PROOFLY_COOKIE_SECURE:true}
      cookie-same-site: Lax
    pin:
      max-attempts: 5
      lockout-minutes: 15
    pii-key-base64: ${PROOFLY_PII_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    cors-allowed-origins: ${PROOFLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    version: OPENAPI_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [corrId=%X{correlationId:-},tid=%X{tenantId:-}]"
