# ==============================================================================
# Proofly Backend Configuration (Env-Driven via application.properties)
# All operational values, credentials, timeouts, and URLs are injected from env.
# ==============================================================================

spring.application.name=${PROOFLY_APP_NAME:proofly-api}
spring.threads.virtual.enabled=${PROOFLY_VIRTUAL_THREADS:true}

# Flyway is explicitly invoked per datasource track (control vs tenant)
spring.flyway.enabled=false

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis (Rate limits, JTI token denylist, idempotency cache)
spring.data.redis.host=${PROOFLY_REDIS_HOST:localhost}
spring.data.redis.port=${PROOFLY_REDIS_PORT:6379}
spring.data.redis.password=${PROOFLY_REDIS_PASSWORD:}

# Spring Modulith
spring.modulith.events.jdbc.schema-initialization.enabled=false

# SMTP / Mailpit (Notification email channel)
spring.mail.host=${PROOFLY_SMTP_HOST:localhost}
spring.mail.port=${PROOFLY_SMTP_PORT:1025}
spring.mail.username=${PROOFLY_SMTP_USERNAME:}
spring.mail.password=${PROOFLY_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${PROOFLY_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${PROOFLY_SMTP_STARTTLS:false}

# Server
server.port=${PROOFLY_SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# App & Frontend URLs (Used for verification links, password reset links, Paystack callbacks)
proofly.app.frontend-base-url=${PROOFLY_FRONTEND_BASE_URL:http://localhost:3000}
proofly.app.api-base-url=${PROOFLY_API_BASE_URL:http://localhost:8080}
proofly.app.support-email=${PROOFLY_SUPPORT_EMAIL:support@proofly.com}

# Control-Plane Database
proofly.control-plane.jdbc-url=${PROOFLY_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/proofly_control}
proofly.control-plane.username=${PROOFLY_CONTROL_DB_USERNAME:proofly_admin}
proofly.control-plane.password=${PROOFLY_CONTROL_DB_PASSWORD:proofly_local_dev_password}
proofly.control-plane.max-pool-size=${PROOFLY_CONTROL_POOL_MAX:12}
proofly.control-plane.min-idle=${PROOFLY_CONTROL_POOL_MIN_IDLE:2}

# Tenant Database Pool & Migration Orchestrator
proofly.tenancy.default-db-host=${PROOFLY_TENANT_DB_HOST:localhost}
proofly.tenancy.default-db-port=${PROOFLY_TENANT_DB_PORT:5432}
proofly.tenancy.db-username=${PROOFLY_TENANT_DB_USERNAME:proofly_admin}
proofly.tenancy.db-password=${PROOFLY_TENANT_DB_PASSWORD:proofly_local_dev_password}
proofly.tenancy.use-pgbouncer=${PROOFLY_USE_PGBOUNCER:false}
proofly.tenancy.max-cached-pools=${PROOFLY_TENANT_MAX_CACHED_POOLS:25}
proofly.tenancy.per-tenant-max-pool-size=${PROOFLY_TENANT_POOL_MAX:3}
proofly.tenancy.per-tenant-min-idle=${PROOFLY_TENANT_POOL_MIN_IDLE:0}
proofly.tenancy.global-connection-cap=${PROOFLY_TENANT_GLOBAL_CAP:90}
proofly.tenancy.migration-concurrency=${PROOFLY_MIGRATION_CONCURRENCY:4}
proofly.tenancy.migration-failure-threshold=${PROOFLY_MIGRATION_FAIL_THRESHOLD:3}
proofly.tenancy.expected-tenant-schema-version=${PROOFLY_EXPECTED_TENANT_SCHEMA:2}
proofly.tenancy.default-plan-code=${PROOFLY_DEFAULT_PLAN_CODE:FREE}
proofly.tenancy.provisioning-max-retries=${PROOFLY_PROVISIONING_MAX_RETRIES:5}
proofly.tenancy.provisioning-retry-delay-seconds=${PROOFLY_PROVISIONING_RETRY_DELAY_SEC:30}
proofly.tenancy.drift-check-enabled=${PROOFLY_TENANCY_DRIFT_CHECK_ENABLED:true}

# Security & Auth
proofly.security.jwt.issuer=${PROOFLY_JWT_ISSUER:https://api.proofly.com}
proofly.security.jwt.key-id=${PROOFLY_JWT_KEY_ID:proofly-k1}
proofly.security.jwt.access-token-ttl-seconds=${PROOFLY_ACCESS_TOKEN_TTL_SEC:900}
proofly.security.jwt.refresh-token-ttl-seconds=${PROOFLY_REFRESH_TOKEN_TTL_SEC:2592000}
proofly.security.jwt.cookie-name=${PROOFLY_REFRESH_COOKIE_NAME:proofly_refresh}
proofly.security.jwt.cookie-secure=${PROOFLY_COOKIE_SECURE:true}
proofly.security.jwt.cookie-same-site=${PROOFLY_COOKIE_SAME_SITE:Lax}
proofly.security.pin.max-attempts=${PROOFLY_PIN_MAX_ATTEMPTS:5}
proofly.security.pin.lockout-minutes=${PROOFLY_PIN_LOCKOUT_MINUTES:15}
proofly.security.reset-token-ttl-minutes=${PROOFLY_RESET_TOKEN_TTL_MINUTES:15}
proofly.security.verify-token-ttl-hours=${PROOFLY_VERIFY_TOKEN_TTL_HOURS:24}
proofly.security.pii-key-base64=${PROOFLY_PII_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
proofly.security.cors-allowed-origins=${PROOFLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Notification Outbox & Delivery Channels
proofly.notification.from-email=${PROOFLY_MAIL_FROM:no-reply@proofly.com}
proofly.notification.from-name=${PROOFLY_MAIL_FROM_NAME:Proofly}
proofly.notification.sms-provider=${PROOFLY_SMS_PROVIDER:log}
proofly.notification.sms-api-url=${PROOFLY_SMS_API_URL:}
proofly.notification.sms-api-key=${PROOFLY_SMS_API_KEY:}
proofly.notification.sms-sender-id=${PROOFLY_SMS_SENDER_ID:Proofly}
proofly.notification.max-attempts=${PROOFLY_NOTIFY_MAX_ATTEMPTS:5}
proofly.notification.base-retry-seconds=${PROOFLY_NOTIFY_RETRY_SEC:30}
proofly.notification.batch-size=${PROOFLY_NOTIFY_BATCH_SIZE:25}
proofly.notification.processing-timeout-seconds=${PROOFLY_NOTIFY_PROCESSING_TIMEOUT_SEC:120}

# Multi-Currency Gateway-Routed Billing, Ledger & Dunning
proofly.billing.default-currency=${PROOFLY_BILLING_DEFAULT_CURRENCY:NGN}
proofly.billing.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
proofly.billing.paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_replace_with_env}
proofly.billing.paystack.public-key=${PAYSTACK_PUBLIC_KEY:pk_test_replace_with_env}
proofly.billing.paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET:${PAYSTACK_SECRET_KEY:sk_test_replace_with_env}}
proofly.billing.paystack.callback-url=${PAYSTACK_CALLBACK_URL:${PROOFLY_FRONTEND_BASE_URL:http://localhost:3000}/billing/callback}
proofly.billing.paystack.currencies=${PROOFLY_PAYSTACK_CURRENCIES:NGN,GHS,KES}

proofly.billing.stripe.base-url=${STRIPE_BASE_URL:https://api.stripe.com}
proofly.billing.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_stripe_replace_with_env}
proofly.billing.stripe.public-key=${STRIPE_PUBLIC_KEY:pk_test_stripe_replace_with_env}
proofly.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_replace_with_env}
proofly.billing.stripe.webhook-tolerance-seconds=${STRIPE_WEBHOOK_TOLERANCE_SEC:300}
proofly.billing.stripe.success-url=${STRIPE_SUCCESS_URL:${PROOFLY_FRONTEND_BASE_URL:http://localhost:3000}/billing/callback}
proofly.billing.stripe.cancel-url=${STRIPE_CANCEL_URL:${PROOFLY_FRONTEND_BASE_URL:http://localhost:3000}/workspace?tab=billing}
proofly.billing.stripe.currencies=${PROOFLY_STRIPE_CURRENCIES:USD,GBP}

proofly.billing.grace-period-days=${PROOFLY_BILLING_GRACE_DAYS:5}
proofly.billing.major-op-reverify-threshold-minor=${PROOFLY_LEDGER_REVERIFY_THRESHOLD:1000000}
proofly.billing.pending-sweep-min-minutes=${PROOFLY_BILLING_PENDING_SWEEP_MIN:5}
proofly.billing.pending-sweep-max-hours=${PROOFLY_BILLING_PENDING_SWEEP_HOURS:48}
proofly.billing.pending-sweep-batch-size=${PROOFLY_BILLING_PENDING_SWEEP_BATCH:25}

# Resilience4j Circuit Breakers & Retries
resilience4j.retry.instances.paystack.max-attempts=${PROOFLY_PAYSTACK_RETRY_ATTEMPTS:3}
resilience4j.retry.instances.paystack.wait-duration=${PROOFLY_PAYSTACK_RETRY_WAIT:500ms}
resilience4j.circuitbreaker.instances.paystack.sliding-window-size=10
resilience4j.circuitbreaker.instances.paystack.failure-rate-threshold=50
resilience4j.retry.instances.stripe.max-attempts=${PROOFLY_STRIPE_RETRY_ATTEMPTS:3}
resilience4j.retry.instances.stripe.wait-duration=${PROOFLY_STRIPE_RETRY_WAIT:500ms}
resilience4j.circuitbreaker.instances.stripe.sliding-window-size=10
resilience4j.circuitbreaker.instances.stripe.failure-rate-threshold=50
resilience4j.retry.instances.notification.max-attempts=${PROOFLY_NOTIFY_CLIENT_RETRY:2}
resilience4j.retry.instances.notification.wait-duration=300ms

# OpenAPI / Swagger
springdoc.api-docs.version=OPENAPI_3_1
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method

# Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
logging.pattern.level=%5p [corrId=%X{correlationId:-},tid=%X{tenantId:-}]
