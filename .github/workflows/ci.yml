name: Proofly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Backend Build, Modulith, ArchUnit & Testcontainers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit, ArchUnit, Modulith & Testcontainers suites
        run: ./mvnw -B verify
      - name: Export OpenAPI 3.1 spec and verify no drift
        run: |
          ./mvnw -B test -Dtest=OpenApiExportTest
          git diff --exit-code ../docs/openapi.yaml || (echo "OpenAPI spec changed; regenerate and commit /docs/openapi.yaml" && exit 1)

  openapi-breaking-check:
    name: OpenAPI Breaking Change Gate (oasdiff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check OpenAPI breaking changes against base branch
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: origin/${{ github.base_ref }}:docs/openapi.yaml
          revision: docs/openapi.yaml
          fail-on-diff: true

  frontend-verify:
    name: Frontend Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx --test packages/api-client/src/*.test.ts apps/web/src/**/*.test.ts
      - run: npm run build

  security-scan:
    name: Secret Scan & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
